<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — OWASP Scanner</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #040d18; color: #c8dae8; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    main { width: min(22rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #1a3a5c; border-radius: 12px; background: #071525; }
    h1 { margin-top: 0; color: #00d4ff; font-size: 1.35rem; }
    label { display: block; margin: 1rem 0 .35rem; }
    input { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #1a3a5c; border-radius: 6px; background: #040d18; color: inherit; }
    button { width: 100%; margin-top: 1.4rem; padding: .75rem; border: 0; border-radius: 6px; background: #00d4ff; color: #001018; font-weight: 700; cursor: pointer; }
    .error { padding: .7rem; border: 1px solid #a84254; border-radius: 6px; color: #ff9eae; }
  </style>
</head>
<body>
  <main>
    <h1>OWASP Scanner</h1>
    <p>Sign in to access the scanner dashboard.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Administrator username</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="128" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
