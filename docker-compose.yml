services:
  owasp-scanner:
    build: .
    image: owasp-scanner:v2
    container_name: owasp-scanner
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      FLASK_ENV: production
      SCANNER_ENV: "${SCANNER_ENV:-production}"
      PYTHONUNBUFFERED: "1"
      SECRET_KEY: "${SECRET_KEY:-}"
      SCANNER_ADMIN_USERNAME: "${SCANNER_ADMIN_USERNAME:-}"
      SCANNER_ADMIN_PASSWORD_HASH: "${SCANNER_ADMIN_PASSWORD_HASH:-}"
      SCANNER_ALLOWED_TARGETS: "${SCANNER_ALLOWED_TARGETS:-}"
      SCANNER_COOKIE_SECURE: "${SCANNER_COOKIE_SECURE:-true}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
