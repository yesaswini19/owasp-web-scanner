version: "3.9"

services:
  owasp-scanner:
    build: .
    image: owasp-scanner:v2
    container_name: owasp-scanner
    ports:
      - "5000:5000"
    volumes:
      - scanner-logs:/app/logs
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  scanner-logs:
