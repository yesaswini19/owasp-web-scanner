events {}

http {
    access_log off;

    server {
        listen 5000;
        client_max_body_size 2m;

        location / {
            proxy_pass http://owasp-scanner:5000;
            proxy_set_header Host $host;
            proxy_read_timeout 180s;
        }
    }

    server {
        listen 8080;
        client_max_body_size 2m;

        location / {
            proxy_pass http://dvwa:80;
            proxy_set_header Host $host;
        }
    }
}
